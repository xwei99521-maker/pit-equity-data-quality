[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pit-equity-data-quality"
version = "0.1.0"
description = "Point-in-time equity fundamentals and data quality pipeline built from SEC XBRL filings."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pyarrow>=18,<26",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
